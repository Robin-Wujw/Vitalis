[project]
name = "vitalis"
dynamic = ["version"]
description = "Wearable health data and deterministic training analysis"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.1,<4",
    "httpx>=0.27,<1",
    "apscheduler>=3.10,<4",
    "qrcode[pil]>=7.4,<9",
    "python-dotenv>=1.0,<2",
    "cryptography>=43.0,<51",
    "markdown>=3.7,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.23,<2",
    "hatchling>=1.27,<2",
    "ruff>=0.13,<1",
]

[project.scripts]
vitalis = "vitalis.entrypoints.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/vitalis/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vitalis"]

[tool.hatch.build.targets.wheel.force-include]
"clients/browser_extension" = "vitalis/static/browser_extension"
"THIRD_PARTY_NOTICES.md" = "vitalis/THIRD_PARTY_NOTICES.md"
"THIRD_PARTY_NOTICES.en.md" = "vitalis/THIRD_PARTY_NOTICES.en.md"

[tool.hatch.build.targets.sdist]
only-include = [
    "src/vitalis",
    "clients/browser_extension",
    "pyproject.toml",
    "README.md",
    "README.en.md",
    "AGENTS.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "uv.lock",
    ".env.example",
    "docs/README.md",
    "docs/quickstart.md",
    "docs/reports.md",
    "docs/architecture.md",
    "docs/data-contracts.md",
    "docs/zepp.md",
    "docs/agents.md",
    "docs/operations.md",
    "docs/examples/reports",
    "skills/vitalis/SKILL.md",
    "skills/vitalis/references/api.md",
    "skills/vitalis/scripts/vitalis_api.py",
    "tools/check.py",
    "tools/check_docs.py",
    "tools/generate_api_reference.py",
    "tools/generate_report_examples.py",
    "tools/upgrade_deployment_db.py",
    "THIRD_PARTY_NOTICES.md",
    "THIRD_PARTY_NOTICES.en.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
